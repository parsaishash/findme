# Docker Compose overrides for staging environment

version: '3.8'

services:
  web:
    environment:
      - DJANGO_ENV=staging
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=staging.findme.example.com
      - DJANGO_ROOT_ENDPOINT=/
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  db:
    environment:
      - POSTGRES_DB=findme_staging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  celery_worker:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  celery_beat:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M