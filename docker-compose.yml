version: '3.8'

services:
  # Django web application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: findme-web
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      # Default to production, overridden by profiles
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - DJANGO_ROOT_ENDPOINT=${DJANGO_ROOT_ENDPOINT:-/}
      - FORCE_SCRIPT_NAME=/findme
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./findme/data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - default
      - traefik-net
    ports:
      - "8000:8000"
    # Production: gunicorn, Development: runserver
    command: ${WEB_COMMAND:-gunicorn --bind 0.0.0.0:8000 --workers 3 findme.wsgi:application}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Traefik labels for reverse proxy configuration (production/staging only)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.findme.rule=PathPrefix(`/findme`)"
      - "traefik.http.routers.findme.entrypoints=websecure"
      - "traefik.http.routers.findme.tls=true"
      - "traefik.http.routers.findme.tls.certresolver=selfsigned"
      - "traefik.http.routers.findme.service=findme"
      - "traefik.http.services.findme.loadbalancer.server.port=8000"
      - "traefik.http.services.findme.loadbalancer.server.scheme=http"
      - "traefik.http.routers.findme.middlewares=findme-stripprefix,findme-headers"
      - "traefik.http.middlewares.findme-stripprefix.stripprefix.prefixes=/findme"
      - "traefik.http.middlewares.findme-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.findme-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.findme-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"

  # Redis for Celery backend
  redis:
    image: redis:7-alpine
    container_name: findme-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - default
    # No ports exposed - internal service only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Celery worker for background tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: findme-celery-worker
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./findme/data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - default
    # No ports exposed - internal service only
    command: celery -A findme worker -l info --concurrency=2


  # Celery beat for scheduled tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: findme-celery-beat
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./findme/data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - default
    # No ports exposed - internal service only
    command: celery -A findme beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler


  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: findme-db
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-findme}
      - POSTGRES_USER=${POSTGRES_USER:-findme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    # No ports exposed - internal service only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findme} -d ${POSTGRES_DB:-findme}"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Traefik reverse proxy
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      # HTTP entrypoint - standard port 80
      - "80:80"
      # HTTPS entrypoint - standard port 443
      - "443:443"
      # Dashboard entrypoint - custom port to avoid conflicts
      - "8081:8081"
    volumes:
      # Docker socket for auto-discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Static configuration
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic configuration
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      # SSL certificates storage (persistent)
      - traefik_certs:/etc/traefik/certs
      # Log files with rotation
      - traefik_logs:/var/log/traefik
    environment:
      # Enable Docker provider
      - TRAEFIK_PROVIDERS_DOCKER=true
      # Watch for Docker events
      - TRAEFIK_PROVIDERS_DOCKER_WATCH=true
      # Expose containers by default (can be overridden per service)
      - TRAEFIK_PROVIDERS_DOCKER_EXPOSED_BY_DEFAULT=false
      # Network to use for container discovery
      - TRAEFIK_PROVIDERS_DOCKER_NETWORK=traefik-net
    networks:
      - traefik-net
    labels:
      # Disable Traefik proxy for Traefik itself
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


networks:
  # Default network for internal service communication
  default:
    driver: bridge
  # Network for Traefik integration
  traefik-net:
    driver: bridge
    name: traefik-net

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  traefik_certs:
    driver: local
  traefik_logs:
    driver: local
