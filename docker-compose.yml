---
services:
  # Django web application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: web
    restart: unless-stopped
    env_file:
      - ./findme/.env
    environment:
      - TZ=Asia/Tehran
      # Default to production, overridden by profiles
      #- DJANGO_ENV=${DJANGO_ENV:-production}
      #- DJANGO_DEBUG=${DJANGO_DEBUG:-0}
        #- DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - DJANGO_ROOT_ENDPOINT=${DJANGO_ROOT_ENDPOINT:-/findme}
      - FORCE_SCRIPT_NAME=${FORCE_SCRIPT_NAME:-/findme}
      # PostgreSQL configuration
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-findme}
      - POSTGRES_USER=${POSTGRES_USER:-findme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
        #- CELERY_BROKER_URL=redis://redis:6379/0
        #- CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./findme/data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - traefik-public
      - default
    ports:
      - 8000
    # Production: gunicorn, Development: runserver
    command: ${WEB_COMMAND:-gunicorn --bind 0.0.0.0:8000 --workers 3 findme.wsgi:application}
    # Traefik labels for reverse proxy configuration (production/staging only)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.findme.rule=PathPrefix(`/findme`)"
      - "traefik.http.routers.findme.middlewares=findme-stripprefix"
      - "traefik.http.middlewares.findme-stripprefix.stripprefix.prefixes=/findme"
      - "traefik.http.routers.findme.entrypoints=web"
      - "traefik.http.services.findme.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Celery backend
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - default
    # No ports exposed - internal service only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker for background tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: celery-worker
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # PostgreSQL configuration
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-findme}
      - POSTGRES_USER=${POSTGRES_USER:-findme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./findme/data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - default
    # No ports exposed - internal service only
    command: celery -A findme worker -l info --concurrency=2


  # Celery beat for scheduled tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: celery-beat
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-0}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # PostgreSQL configuration
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-findme}
      - POSTGRES_USER=${POSTGRES_USER:-findme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./findme/data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - default
    # No ports exposed - internal service only
    command: celery -A findme beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    env_file:
      - findme/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-findme}
      - POSTGRES_USER=${POSTGRES_USER:-findme}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    # No ports exposed - internal service only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findme} -d ${POSTGRES_DB:-findme}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # Default network for internal service communication
  default:
    driver: bridge
  # Network for Traefik integration
  traefik-public:
    driver: bridge
    external: true

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
