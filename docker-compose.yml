version: '3.8'

services:
  # Django web application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: findme-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - DJANGO_DEBUG=0
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DJANGO_ROOT_ENDPOINT=/findme
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
      - db
    networks:
      - default
      - traefik-net
    ports:
      - "8000:8000"
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 findme.wsgi:application
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Traefik labels for reverse proxy configuration
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      # Router configuration
      - "traefik.http.routers.findme.rule=PathPrefix(`/findme`)"
      - "traefik.http.routers.findme.entrypoints=websecure"
      - "traefik.http.routers.findme.tls=true"
      - "traefik.http.routers.findme.tls.certresolver=selfsigned"
      - "traefik.http.routers.findme.service=findme"
      # Service configuration
      - "traefik.http.services.findme.loadbalancer.server.port=8000"
      - "traefik.http.services.findme.loadbalancer.server.scheme=http"
      # Middlewares - NO StripPrefix to preserve /findme in URLs
      - "traefik.http.routers.findme.middlewares=findme-headers"
      # Security headers middleware
      - "traefik.http.middlewares.findme-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.findme-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.findme-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"

  # Redis for Celery backend
  redis:
    image: redis:7-alpine
    container_name: findme-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker for background tasks
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: findme-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - DJANGO_DEBUG=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
      - db
      - web
    command: celery -A findme worker -l info --concurrency=2

  # Celery beat for scheduled tasks
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: findme-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - DJANGO_DEBUG=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - redis
      - db
      - web
    command: celery -A findme beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # PostgreSQL database (optional, can be swapped with SQLite)
  db:
    image: postgres:15-alpine
    container_name: findme-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=findme
      - POSTGRES_USER=findme
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findme -d findme"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # External network for Traefik integration
  traefik-net:
    external: true
    name: traefik-net

volumes:
  redis_data:
  postgres_data:
  static_volume:
  media_volume:
