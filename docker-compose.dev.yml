# Alternative development configuration
# Use this instead of docker-compose.override.yml for a simpler dev setup

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    volumes:
      - .:/app
    environment:
      - DJANGO_ENV=development
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    volumes:
      - .:/app
    environment:
      - DJANGO_ENV=development
      - DJANGO_DEBUG=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A findme worker -l info --concurrency=2
    depends_on:
      - redis
